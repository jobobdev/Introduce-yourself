<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Introduce Yourself</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #172026;
        background: #f5f1e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(720px, 100%);
        padding: 48px;
        border: 1px solid #d7cdbd;
        border-radius: 8px;
        background: #fffdf8;
        box-shadow: 0 18px 42px rgb(23 32 38 / 0.12);
      }

      p {
        margin: 0;
        line-height: 1.7;
      }

      .eyebrow {
        margin-bottom: 16px;
        color: #5c6f68;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(2.25rem, 8vw, 4rem);
        line-height: 1;
        letter-spacing: 0;
      }

      .summary {
        max-width: 58ch;
        color: #314149;
        font-size: 1.1rem;
      }

      .details {
        display: grid;
        gap: 18px;
        margin-top: 32px;
      }

      .detail {
        padding-top: 18px;
        border-top: 1px solid #e8dfd2;
      }

      .detail strong {
        display: block;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Introduction</p>
      <h1>Hello, I'm Jeonghun.</h1>
      <p class="summary">
        I am learning how to build and publish simple web pages with HTML, CSS,
        Git, and GitHub.
      </p>

      <section class="details" aria-label="Personal introduction">
        <div class="detail">
          <strong>What I like</strong>
          <p>Clean design, practical tools, and learning by making things.</p>
        </div>

        <div class="detail">
          <strong>Current goal</strong>
          <p>Keep improving my coding workflow and publish my work online.</p>
        </div>
      </section>
    </main>
  </body>
</html>

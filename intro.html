<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>조정훈 자기소개</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #15202b;
        background: #f3f7f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(720px, 100%);
        padding: 48px;
        border: 1px solid #cddbd5;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 42px rgb(23 32 38 / 0.12);
      }

      p {
        margin: 0;
        line-height: 1.7;
      }

      .eyebrow {
        margin-bottom: 16px;
        color: #26735d;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(2.25rem, 8vw, 4rem);
        line-height: 1;
        letter-spacing: 0;
      }

      .summary {
        max-width: 58ch;
        color: #33434c;
        font-size: 1.1rem;
      }

      .details {
        display: grid;
        gap: 18px;
        margin-top: 32px;
      }

      .detail {
        padding-top: 18px;
        border-top: 1px solid #dde8e3;
      }

      .detail strong {
        display: block;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Introduction</p>
      <h1>안녕하세요, 조정훈입니다.</h1>
      <p class="summary">
        셀파스에서 세일즈 매니저로 일하고 있습니다. 고객의 문제를 정확히
        이해하고, 필요한 솔루션을 제안하며, 더 나은 결과를 만들기 위해
        꾸준히 소통하는 일을 중요하게 생각합니다.
      </p>

      <section class="details" aria-label="조정훈 자기소개">
        <div class="detail">
          <strong>이름</strong>
          <p>조정훈</p>
        </div>

        <div class="detail">
          <strong>소개</strong>
          <p>셀파스 세일즈 매니저</p>
        </div>
      </section>
    </main>
  </body>
</html>
